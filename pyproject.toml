# Poetry project configuration.
#
# Poetry is a Python dependency manager and packaging tool. This file declares
# the project metadata, runtime dependencies, development dependencies, and
# pytest options. `poetry.lock` (generated by `poetry lock`) pins every
# transitive dependency for reproducible builds.

[tool.poetry]
# Project metadata used when building or publishing the package.
name = "mlops-demo"
version = "0.1.0"
description = "Teaching project: ML model, Docker, Compose, and webhooks"
authors = ["MLOps Course"]
readme = "README.md"
# Tell Poetry which local package to include. Without this, `app` would not be
# importable as a package when the project is installed.
packages = [{ include = "app" }]

[tool.poetry.dependencies]
# Runtime dependencies. The ^ operator allows compatible updates (e.g. ^1.5.2
# allows 1.5.2 and higher patch/minor versions, but not 2.0.0).
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.6", extras = ["standard"] }
pydantic = "^2.9.2"
scikit-learn = "^1.5.2"
numpy = "^2.1.1"
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]
# Dev dependencies are only installed when Poetry's dev group is active.
# They are not included in the production Docker image built by Dockerfile.poetry.
pytest = "^8.3.3"
httpx = "^0.27.2"

[build-system]
# Declares which build backend Poetry should use to create the package.
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Default pytest command-line options. -v shows each test name; --tb=short
# produces shorter tracebacks on failure. testpaths limits discovery to tests/.
testpaths = ["tests"]
addopts = "-v --tb=short"